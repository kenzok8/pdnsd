name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# pdnsd uses a pre-generated ./configure from the original 2012 autoconf release.
# The custom aclocal.m4 macros reference internal autoconf APIs removed in 2.70+,
# making autoreconf incompatible with modern systems.
# CI skips autoreconf and uses the bundled configure directly to validate C
# compilation on modern GCC/Clang.

jobs:
  build:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
          - compiler: clang
            cc: clang
    steps:
      - uses: actions/checkout@v6

      - name: configure
        env:
          CC: ${{ matrix.cc }}
        run: ./configure

      - name: build
        run: make -j$(nproc)
