name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get install -y build-essential
      - name: Normalize autotools timestamps
        run: |
          touch configure aclocal.m4 Makefile.in config.h.in
          touch src/Makefile.in src/pdnsd-ctl/Makefile.in doc/Makefile.in
      - name: configure
        run: ./configure
      - name: build
        run: make -j$(nproc)
