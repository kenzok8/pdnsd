name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get install -y build-essential autoconf automake
      - name: autoreconf
        run: autoreconf -fi
      - name: configure
        run: ./configure
      - name: build
        run: make -j$(nproc)
